apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: novastream
spec:
  replicas: 6
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      containers:
        - name: gateway
          image: ghcr.io/novastream/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 50050, name: grpc }
          env:
            - { name: HTTP_ADDR, value: ":8080" }
            - { name: GRPC_ADDR, value: ":50050" }
            - name: REDIS_URL
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: redis_url } }
            - name: JWT_PUBLIC_KEY_PEM
              valueFrom: { secretKeyRef: { name: gateway-secrets, key: jwt_public_pem } }
            - { name: PLAYLIST_GRPC_ADDR, value: "playlist-ingestion:50051" }
            - { name: EPG_GRPC_ADDR, value: "epg:50055" }
            - { name: DVR_GRPC_ADDR, value: "dvr:50056" }
            - { name: PLAYBACK_GRPC_ADDR, value: "playback:50053" }
            - { name: SEARCH_GRPC_ADDR, value: "search:50060" }
            - { name: RECO_GRPC_ADDR, value: "recommendation:50061" }
            - { name: USER_GRPC_ADDR, value: "user:50059" }
            - { name: AUTH_GRPC_ADDR, value: "auth:50058" }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app.kubernetes.io/name: gateway }
  ports:
    - { port: 80, targetPort: 8080, name: http }
    - { port: 50050, targetPort: 50050, name: grpc }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 6
  maxReplicas: 60
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
spec:
  minAvailable: 4
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
