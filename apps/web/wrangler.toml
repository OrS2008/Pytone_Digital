name = "nova-stream"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Firebase Authentication — Firebase is the source of truth for
# email/password auth (signup, login, password reset, email
# verification) AND is what delivers the verification + reset emails.
# Configured in the Firebase Console for project `nova-stream-4ee03`.
#
# The Web API key is safe in plaintext — Firebase designs it as a
# public identifier. Sensitive operations require the user's own
# idToken or oobCode (which Firebase issues), so a leaked API key on
# its own grants nothing an attacker doesn't already have via the
# user-facing Web SDK.
[vars]
FIREBASE_API_KEY     = "AIzaSyDQnISrsyATFS5w7_fRMy-pSlRC741HIms"
FIREBASE_AUTH_DOMAIN = "nova-stream-4ee03.firebaseapp.com"
FIREBASE_PROJECT_ID  = "nova-stream-4ee03"

# Canonical public origin used to build email links (verification /
# password-reset continueUrl). Pin it so the link can never be forged
# via a spoofed x-forwarded-host header. Set to the production origin.
# If omitted, links fall back to the platform-set `host` header (still
# not the client-controlled x-forwarded-host).
PUBLIC_BASE_URL = "https://nova-stream-cce.pages.dev"

# Admin panel identity. The password hash + session secret are stored
# in the Cloudflare Pages dashboard as encrypted Secrets (not here)
# because wrangler.toml is committed to the repo. Only the public
# username — which is just an identifier the operator types into the
# /admin/login form — lives in plaintext.
ADMIN_USERNAME = "admin@novastream.tv"

# NOVA_KV binding — accounts, sessions, settings blobs, watch history.
# Keys are prefixed (user: / session: / settings: / history:) so one
# namespace serves all roles.
#
# Cloudflare Pages reads bindings from this file as the source of truth
# when wrangler.toml is present (the dashboard's "+ Add" button on the
# Bindings page is disabled in that mode). To rotate to a new
# namespace, replace the id below and redeploy.
#
# Without a valid binding the auth + settings + privacy API routes
# return 503 with a clear "bind NOVA_KV" message so the missing config
# is obvious in the UI.
[[kv_namespaces]]
binding = "NOVA_KV"
id = "3ffc4115cca54b799dcb72983b4575a8"
