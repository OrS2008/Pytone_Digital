name = "nova-stream"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# Mailtrap email sending — used by /api/email/activate to send
# verification emails on signup. The lib has a hard-coded fallback for
# fresh clones; in production override these via the Cloudflare Pages
# dashboard (Settings → Environment variables) so the secret token
# doesn't live in the repo.
#
# Required: a verified sender domain. If MAILTRAP_FROM_EMAIL is on an
# unverified domain Mailtrap returns 422 and the signup flow shows the
# user a "delivery not configured yet" notice (account still works).
[vars]
MAILTRAP_API_URL   = "https://send.api.mailtrap.io/api/send"
MAILTRAP_FROM_EMAIL = "noreply@novastream.tv"
MAILTRAP_FROM_NAME  = "Nova Stream"

# Single KV namespace for everything user-scoped: accounts, sessions,
# settings blobs, watch history. Keys are prefixed (user: / session: /
# settings: / history:) so one namespace serves all roles and the
# Cloudflare dashboard only needs one binding configured.
#
# The id="" placeholder below is what `wrangler dev` uses locally.
# On Cloudflare Pages this binding is wired through the dashboard:
#   Settings → Functions → KV namespace bindings → Variable name
#   NOVA_KV → KV namespace = (the one you created)
# Without the binding the auth + settings API routes return 503 with
# a clear message so it's obvious the namespace isn't set up.
[[kv_namespaces]]
binding = "NOVA_KV"
id = ""
