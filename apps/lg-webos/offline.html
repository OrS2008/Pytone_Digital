<!DOCTYPE html>
<html lang="en">
<!--
  Offline fallback. Reached only when boot.js cannot confirm reachability of
  the hosted app within 1.5 s. We keep this file completely self-contained:
  no network, no external assets, no remote fonts.
-->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, initial-scale=1">
  <title>Pytone — offline</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: #06070A; color: #E9EBF1;
      font-family: 'LG Smart UI', 'Helvetica Neue', sans-serif;
      overflow: hidden;
    }
    main {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }
    .wordmark {
      color: #FF3B6E; font-weight: 800; font-size: 64px;
      letter-spacing: 16px; margin-left: 16px;
    }
    h1 { font-size: 36px; font-weight: 600; margin: 56px 0 12px; }
    p  { font-size: 22px; color: #B7BEC9; max-width: 720px; line-height: 1.45; }
    .retry {
      margin-top: 48px; padding: 16px 36px;
      background: #FF3B6E; color: #fff; border: 0; border-radius: 10px;
      font-size: 22px; font-weight: 700;
      outline: none;
    }
    .retry:focus { box-shadow: 0 0 0 4px rgba(255, 59, 110, 0.4); }
    .countdown { margin-top: 28px; color: #6E7480; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <div class="wordmark">PYTONE</div>
    <h1>Can't reach Pytone right now</h1>
    <p>Check your TV is connected to the internet. We'll try again automatically.</p>
    <button id="retry" class="retry" autofocus>Try again</button>
    <div class="countdown" id="countdown">Retrying in 5s…</div>
  </main>

  <script>
    (function () {
      var btn = document.getElementById('retry');
      var cd  = document.getElementById('countdown');
      var t = 5;

      function go() { window.location.replace('index.html'); }
      btn.addEventListener('click', go);
      // webOS remote: Enter / OK = 13
      document.addEventListener('keydown', function (e) {
        if (e.keyCode === 13) go();
      });

      setInterval(function () {
        t = t === 1 ? 5 : t - 1;
        cd.textContent = 'Retrying in ' + t + 's…';
        if (t === 5) go();
      }, 1000);
    })();
  </script>
</body>
</html>
