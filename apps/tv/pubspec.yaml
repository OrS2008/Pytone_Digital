name: pytone_tv
description: Pytone Digital TV app — Android TV, Google TV, Apple TV, Fire TV, Tizen, WebOS.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  cached_network_image: ^3.4.0
  grpc: ^4.0.1
  protobuf: ^3.1.0
  hive_flutter: ^1.1.0
  shimmer: ^3.0.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/animations/
  fonts:
    - family: PytoneDisplay
      fonts:
        - asset: assets/fonts/PytoneDisplay-Regular.ttf
        - asset: assets/fonts/PytoneDisplay-Bold.ttf
          weight: 700
