name: deploy-worker

# Deploys apps/web as a Cloudflare Worker (OpenNext). Manual only —
# production deploys stay an explicit owner action.
#
# Needs repository secrets:
#   CLOUDFLARE_API_TOKEN   token with "Workers Scripts: Edit" (+ "Workers KV
#                          Storage: Edit" is not needed; the KV id is in
#                          wrangler.toml)
#   CLOUDFLARE_ACCOUNT_ID
# Worker secrets (NOVA_ENCRYPTION_KEY, Stripe, admin…) are set once with
# `wrangler secret put` — see OPENNEXT_MIGRATION.md.

on:
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Check secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=low
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_BUILD_ID: ${{ github.sha }}
        run: npx opennextjs-cloudflare build && npx opennextjs-cloudflare deploy
