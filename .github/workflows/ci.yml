name: ci

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — saves a lot of minutes when
# pushing rapid fixups.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Go workspace -------------------------------------------------------
  #
  # `go test ./...` does NOT recurse across modules in a Go workspace; we
  # have to invoke it per-module. We list the modules from `go list -m` and
  # iterate. Each step runs in a fresh shell so a single module's failure
  # surfaces clearly in the GH Actions UI.
  go:
    name: Go workspace
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novastream
          POSTGRES_PASSWORD: novastream
          POSTGRES_DB: novastream
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U novastream" --health-interval=5s --health-timeout=3s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            **/go.sum
      - name: Vet (all modules)
        run: |
          set -euo pipefail
          for d in $(go list -m -f '{{.Dir}}'); do
            echo "::group::go vet $d"
            (cd "$d" && go vet ./...)
            echo "::endgroup::"
          done
      - name: Test (all modules)
        env:
          DATABASE_URL: postgres://novastream:novastream@localhost:5432/novastream?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
        run: |
          set -euo pipefail
          for d in $(go list -m -f '{{.Dir}}'); do
            echo "::group::go test $d"
            (cd "$d" && go test ./... -race -count=1)
            echo "::endgroup::"
          done

  # --- Proto lint --------------------------------------------------------
  proto-lint:
    name: Proto lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint libs/proto
      - name: Breaking-change check
        # Compares against main; allowed to fail on feature branches that
        # have already merged the breaking change locally.
        run: buf breaking libs/proto --against 'https://github.com/${{ github.repository }}.git#branch=main,subdir=libs/proto'
        continue-on-error: true

  # --- Flutter TV --------------------------------------------------------
  flutter-tv:
    name: Flutter TV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.x'
      - run: flutter pub get
        working-directory: apps/tv
      - run: flutter analyze
        working-directory: apps/tv
      - run: flutter test
        working-directory: apps/tv

  # --- Web (Next.js) -----------------------------------------------------
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      # `next build` runs ESLint internally with the same config; this
      # explicit step gives a clearer failure surface for lint issues.
      - run: npm run lint
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  # --- Docker images -----------------------------------------------------
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [go]
    if: github.event_name == 'push'
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        service:
          - gateway
          - auth
          - playlist-ingestion
          - epg
          - playback
          - dvr
          - recording
          - ai-playback
          - search
          - recommendation
          - metadata
          - user
          - sync
          - sports
          - analytics
          - notification
          - streaming
          - transcoding
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/Dockerfile.go
          build-args: |
            SERVICE=${{ matrix.service }}
            BINARY=${{ matrix.service == 'recording' && 'worker' || 'server' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:latest
          push: ${{ github.ref == 'refs/heads/main' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
