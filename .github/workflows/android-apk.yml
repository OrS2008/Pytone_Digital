name: android-apk

# Build a sideload-ready Android APK from the Capacitor shell under
# apps/android/. The shell points its WebView at the live Cloudflare
# Pages deploy, so the APK doesn't bundle the web build — it just
# loads https://nova-stream-cce.pages.dev/tv inside a fully native
# Activity with our splash + status-bar + theme.
#
# The APK is signed with a generated debug keystore (deterministic per
# run, but valid Android signature) so the user can install it
# directly. For Play Store / production we'd swap in a real keystore
# from secrets — see the commented `releaseKeystore` block.
#
# Trigger:
#   - Manually via `workflow_dispatch` (most common — fire from the
#     Actions tab when you want a build).
#   - Automatically when files under apps/android/** change.

on:
  workflow_dispatch:
  push:
    branches: ["claude/**", "main"]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

# We publish to a GitHub Release on every build, which needs write
# access to repo contents (releases live under `contents`). Default
# GITHUB_TOKEN permissions on workflows are read-only.
permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Install Capacitor dependencies
        working-directory: apps/android
        run: |
          npm install --no-audit --no-fund

      - name: Scaffold android/ project (cap add android)
        working-directory: apps/android
        run: |
          set -euxo pipefail
          # `cap add android` reads capacitor.config.ts, generates the
          # android/ directory, and copies the webDir contents into
          # android/app/src/main/assets/public.
          npx cap add android

      - name: Generate launcher icons + splash from SVG
        working-directory: apps/android
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund --no-save sharp@^0.33.4
          node resources/generate-android-assets.mjs "$PWD/android/app/src/main"

      - name: Apply Android overrides (theme, manifest, MainActivity)
        working-directory: apps/android
        run: |
          set -euxo pipefail
          # Copy our customisations on top of the scaffolded project.
          # cp -r preserves directory structure so each file lands at
          # the right path under android/app/src/main/...
          cp -rv android-overrides/app/src/main/. android/app/src/main/

          # Capacitor ships res/values/ic_launcher_background.xml with
          # the default Ionic purple. Overwrite with our brand bg so
          # the adaptive icon matches the rest of the app.
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F1116</color>
          </resources>
          XML

          # Patch namespace + applicationId + versionCode/Name into the
          # scaffolded build.gradle. Capacitor already derives these
          # from appId, so these are mostly no-ops — but they ensure
          # the values match what we expect if the upstream template
          # changes.
          BG=android/app/build.gradle
          sed -i 's|namespace ".*"|namespace "tv.novastream.app"|'              "$BG"
          sed -i 's|applicationId ".*"|applicationId "tv.novastream.app"|'      "$BG"
          # Use [0-9]\+ (one-or-more) not [0-9]* (zero-or-more): the
          # latter happily matches an empty string and would corrupt
          # `versionCode rootProject.ext.versionCode` into
          # `versionCode 1rootProject.ext.versionCode`. Capacitor's
          # template uses literal digits here, but be defensive.
          # versionCode must increase with every build or Android refuses
          # to install the new APK over the old one.
          sed -i 's|versionCode [0-9]\+|versionCode ${{ github.run_number }}|'  "$BG"
          sed -i 's|versionName ".*"|versionName "1.0.${{ github.run_number }}"|' "$BG"
          # minSdk lives in android/variables.gradle in Capacitor 6
          # (referenced from app/build.gradle as `rootProject.ext.minSdkVersion`).
          # Patching app/build.gradle would corrupt that reference, so
          # only patch variables.gradle.
          if [ -f android/variables.gradle ]; then
            sed -i 's|minSdkVersion = [0-9]\+|minSdkVersion = 24|'               android/variables.gradle
            echo "--- patched variables.gradle ---"
            cat android/variables.gradle
          fi

          echo "--- patched build.gradle ---"
          cat "$BG"

      - name: Sync Capacitor (apply config + plugins to android/)
        working-directory: apps/android
        run: npx cap sync android

      # ── Signing ────────────────────────────────────────────────────────
      # Release builds are signed with the OWNER's permanent keystore,
      # supplied as repository secrets (never committed):
      #   ANDROID_KEYSTORE_B64       base64 of the .jks / .keystore file
      #   ANDROID_KEYSTORE_PASSWORD  store password
      #   ANDROID_KEY_ALIAS          key alias
      #   ANDROID_KEY_PASSWORD       key password
      # Same key every build → each APK installs as an UPDATE over the
      # previous one. Without the secrets the workflow falls back to a
      # debug build and says so loudly: debug APKs get a fresh throw-away
      # signature per run and cannot update an installed copy.
      - name: Decide build type
        id: mode
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "release=true" >> "$GITHUB_OUTPUT"; else echo "release=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install release keystore and signing config
        if: steps.mode.outputs.release == 'true'
        working-directory: apps/android/android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # A second android {} block merges with the scaffolded one.
          # Passwords are read from the environment at build time and
          # never written to disk.
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  novaRelease {
                      storeFile file(System.getenv("NOVA_KEYSTORE_FILE"))
                      storePassword System.getenv("NOVA_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("NOVA_KEY_ALIAS")
                      keyPassword System.getenv("NOVA_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.novaRelease
                      minifyEnabled false
                      debuggable false
                  }
              }
          }
          GRADLE

      - name: Build signed release APK
        if: steps.mode.outputs.release == 'true'
        working-directory: apps/android/android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g
          NOVA_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/nova-stream-${{ github.run_number }}.apk
          # Prove it is signed with the owner key, not a debug key.
          "$ANDROID_HOME"/build-tools/34.0.0/apksigner verify --print-certs ../dist/*.apk | grep -v "Android Debug"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Build debug APK (no release keystore configured)
        if: steps.mode.outputs.release != 'true'
        working-directory: apps/android/android
        env:
          GRADLE_OPTS: -Xmx4g -Dorg.gradle.jvmargs=-Xmx4g
        run: |
          set -euxo pipefail
          echo "::warning title=Debug build::ANDROID_KEYSTORE_B64 is not set. This APK is a DEBUG build with a one-off signature: it cannot be installed over a previous Nova Stream APK and must not be distributed. See ARCHITECTURE_AND_DEPLOYMENT_CHANGES.md → Android signing."
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/nova-stream-${{ github.run_number }}-debug.apk
          ls -la ../dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nova-stream-apk
          path: apps/android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Publish the APK as a GitHub Release so it's downloadable from a
      # permanent public URL — no GitHub login required, no zip wrapper,
      # no 30-day artifact expiry. We use a rolling `apk-latest` tag that
      # gets overwritten on every build, so the URL stays stable:
      #   https://github.com/<owner>/<repo>/releases/download/apk-latest/nova-stream.apk
      # The release also keeps a per-build copy attached as a backup.
      - name: Publish APK to GitHub Release (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Nova Stream APK (latest build)"
          body: |
            Auto-published from workflow run #${{ github.run_number }}
            Commit: ${{ github.sha }}

            **Install on Android**
            1. Download `nova-stream.apk` below
            2. Allow "Install unknown apps" for your browser / file manager
            3. Tap the file → Install
          files: |
            apps/android/dist/*.apk
          fail_on_unmatched_files: true
          make_latest: true
          # `apk-latest` tag is reused every build — overwrite previous assets.
          generate_release_notes: false

      # Rename the latest copy to a stable filename for the permalink.
      - name: Pin stable filename in release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          # Release builds publish under the stable name. A debug build
          # (no owner keystore) keeps its -debug suffix too, so nobody
          # mistakes it for a signed release.
          src=$(ls apps/android/dist/nova-stream-${{ github.run_number }}*.apk | head -1)
          cp "$src" apps/android/dist/nova-stream.apk
          gh release upload apk-latest apps/android/dist/nova-stream.apk \
            --clobber --repo "${{ github.repository }}"

      - name: Print install instructions
        run: |
          echo "::notice title=APK ready::Download from https://github.com/${{ github.repository }}/releases/download/apk-latest/nova-stream.apk — no login required."
